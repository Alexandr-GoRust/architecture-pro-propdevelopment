# Правило 2: hostPath-тома запрещены.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8spodhostpath
spec:
  crd:
    spec:
      names:
        kind: K8sPodHostPath
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8spodhostpath

        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("том <%v>: hostPath запрещён (используйте emptyDir/PVC)", [volume.name])
        }
