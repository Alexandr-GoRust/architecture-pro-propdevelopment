# НАРУШЕНИЕ: монтирование hostPath корня хоста внутрь контейнера.
# Ожидаемый результат в audit-zone: ОТКЛОНЁН (PodSecurity restricted +
# Gatekeeper-констрейнт no-hostpath).
apiVersion: v1
kind: Pod
metadata:
  name: pod-hostpath
  namespace: audit-zone
spec:
  containers:
    - name: app
      image: alpine
      command: ["sleep", "3600"]
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
