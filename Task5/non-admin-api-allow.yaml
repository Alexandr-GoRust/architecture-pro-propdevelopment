# Задание 5. Сетевые политики: изоляция трафика между UI и API-сервисами.
#
# Пары: front-end <-> back-end-api и admin-front-end <-> admin-back-end-api.
# Трафик разрешён только внутри своей пары (ingress и egress в обе стороны),
# любой остальной трафик к/от этих подов запрещён (политики делают их
# изолированными: всё неразрешённое отбрасывается по умолчанию).
#
# Перед применением развернуть 4 сервиса с метками:
#   kubectl run front-end-app        --image=nginx --labels role=front-end        --expose --port 80
#   kubectl run back-end-api-app     --image=nginx --labels role=back-end-api     --expose --port 80
#   kubectl run admin-front-end-app  --image=nginx --labels role=admin-front-end  --expose --port 80
#   kubectl run admin-back-end-app   --image=nginx --labels role=admin-back-end-api --expose --port 80
#
# Применение: kubectl apply -f non-admin-api-allow.yaml
apiVersion: v1
kind: List
metadata:
  name: non-admin-api-allow
items:
  # Пара «пользовательская»: front-end <-> back-end-api
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-front-end-to-back-end-api
    spec:
      podSelector:
        matchLabels:
          role: back-end-api
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  role: front-end
      egress:
        - to:
            - podSelector:
                matchLabels:
                  role: front-end
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-back-end-api-to-front-end
    spec:
      podSelector:
        matchLabels:
          role: front-end
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  role: back-end-api
      egress:
        - to:
            - podSelector:
                matchLabels:
                  role: back-end-api
  # Пара «административная»: admin-front-end <-> admin-back-end-api
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-admin-front-end-to-admin-back-end-api
    spec:
      podSelector:
        matchLabels:
          role: admin-back-end-api
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  role: admin-front-end
      egress:
        - to:
            - podSelector:
                matchLabels:
                  role: admin-front-end
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: allow-admin-back-end-api-to-admin-front-end
    spec:
      podSelector:
        matchLabels:
          role: admin-front-end
      policyTypes: [Ingress, Egress]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  role: admin-back-end-api
      egress:
        - to:
            - podSelector:
                matchLabels:
                  role: admin-back-end-api
